<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player | CodeAlpha</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <div class="player-container">
    
    <!-- غلاف التراك والمعلومات -->
    <div class="track-art-wrapper">
      <img src="" alt="Album Art" id="track-art" class="track-art" />
    </div>

    <div class="track-details">
      <h2 id="track-title">Song Title</h2>
      <p id="track-artist">Artist Name</p>
    </div>

    <!-- شريط التقدم والوقت -->
    <div class="progress-section">
      <div class="time-display">
        <span id="current-time">0:00</span>
        <span id="total-duration">0:00</span>
      </div>
      <input type="range" id="progress-bar" min="0" max="100" value="0" class="slider" />
    </div>

    <!-- أزرار التحكم في التشغيل -->
    <div class="controls-section">
      <button class="ctrl-btn" id="prev-btn" title="Previous Track">
        <i class="fa-solid fa-backward-step"></i>
      </button>
      <button class="ctrl-btn play-pause-btn" id="play-pause-btn" title="Play">
        <i class="fa-solid fa-play" id="play-icon"></i>
      </button>
      <button class="ctrl-btn" id="next-btn" title="Next Track">
        <i class="fa-solid fa-forward-step"></i>
      </button>
    </div>

    <!-- التحكم في مستوى الصوت -->
    <div class="volume-section">
      <i class="fa-solid fa-volume-low" id="vol-icon"></i>
      <input type="range" id="volume-bar" min="0" max="100" value="80" class="slider" />
      <i class="fa-solid fa-volume-high"></i>
    </div>

    <!-- قائمة التشغيل Playlist (Bonus) -->
    <div class="playlist-section">
      <h3>Playlist</h3>
      <ul class="playlist" id="playlist-list"></ul>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
